<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/style.css">

</head>
<body>
    <div id="app">
        <header>
            <div class="container">
                <h1>Kevin Kam</h1>
                <p class="subtitle">{{ translations[currentLang].subtitle }}</p>
                <div class="social-links">
                    <!-- Instagram and YouTube temporarily hidden -->
                    <a href="https://instagram.com/icaros0226" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-link instagram" style="display: none;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </a>
                    <a href="https://www.youtube.com/@icaros0226" target="_blank" rel="noopener noreferrer" aria-label="YouTube" class="social-link youtube" style="display: none;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="white"/>
                        </svg>
                    </a>
                    <a href="https://shkam.tistory.com/" target="_blank" rel="noopener noreferrer" aria-label="Tistory" class="social-link tistory">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="currentColor">T</text>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <main>
            <div class="container">
                <section class="apps-grid">
                    <div 
                        v-for="app in appsData" 
                        :key="app.appStoreUrl || app.name"
                        class="app-card"
                        :class="{ 'clickable': app.appStoreUrl || app.playStoreUrl }"
                        @click="handleCardClick(app, $event)"
                    >
                        <a 
                            :href="app.appStoreUrl || '#'" 
                            :target="app.appStoreUrl ? '_blank' : ''"
                            class="app-icon-link"
                            @click.stop
                        >
                            <div class="app-icon">
                                <img 
                                    v-if="app.appIconUrl"
                                    :src="app.appIconUrl" 
                                    :alt="getAppName(app) + ' 아이콘'"
                                    class="app-icon-img"
                                    @error="handleImageError($event, app)"
                                />
                                <span v-else class="app-icon-fallback">{{ app.icon || getAppName(app).charAt(0).toUpperCase() }}</span>
                            </div>
                        </a>
                        <h3>{{ getAppName(app) }}</h3>
                        <p>{{ getAppDescription(app) }}</p>
                        <div class="app-links" @click.stop>
                            <a 
                                v-if="app.appStoreUrl"
                                :href="app.appStoreUrl" 
                                target="_blank" 
                                class="btn btn-primary"
                            >
                                {{ getAppStoreLabel(app) }}
                            </a>
                            <a 
                                v-if="app.playStoreUrl"
                                :href="app.playStoreUrl" 
                                target="_blank" 
                                class="btn btn-primary"
                            >
                                Android
                            </a>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <div class="container">
                <p>&copy; 2025 Kevin Kam. All rights reserved.</p>
                <p class="contact">Contact: <a href="mailto:rka777@gmail.com">rka777@gmail.com</a></p>
            </div>
        </footer>
    </div>

    <script src="./assets/js/main.js"></script>
</body>
</html>
